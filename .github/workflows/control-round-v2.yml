name: CUSTOMROM control round v2

on:
  push:
    branches:
      - refactor/customrom-adb-s23-premium
    paths:
      - .github/workflows/control-round-v2.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic product patch
        run: python3 tools/apply_control_round_v2.py

      - name: Validate permanent contracts
        run: python3 tools/validate_native_customrom.py

      - name: Build debug APK
        working-directory: apps/customrom-adb-native
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit verified source changes
        run: |
          git config user.name "CUSTOMROM CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsActivity.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsModels.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/FunctionalActionEngine.kt \
            apps/customrom-adb-native/app/src/main/assets/recipes.json \
            tools/validate_native_customrom.py
          git diff --cached --check
          git commit -m "feat: add contextual system app control and scrollable workflows"
          git push origin HEAD:refactor/customrom-adb-s23-premium

      - name: Prepare artifact proof
        run: |
          APK="apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" CUSTOMROM-ADB-S23-CONTROL-V2-debug.apk
          sha256sum CUSTOMROM-ADB-S23-CONTROL-V2-debug.apk | tee sha256.txt
          {
            echo "source=$(git rev-parse HEAD)"
            echo "branch=refactor/customrom-adb-s23-premium"
            echo "validator=PASS"
            echo "android_build=PASS"
            echo "recipes=$(python3 -c 'import json; print(len(json.load(open("apps/customrom-adb-native/app/src/main/assets/recipes.json"))))')"
          } > build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-S23-CONTROL-V2
          path: |
            CUSTOMROM-ADB-S23-CONTROL-V2-debug.apk
            sha256.txt
            build-info.txt
          if-no-files-found: error
          retention-days: 14
