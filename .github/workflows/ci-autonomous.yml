name: CUSTOMROM CI Autônoma

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customrom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governança e integridade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar fotografia exata
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar governança
        run: node scripts/ci/verify-repository.mjs .
