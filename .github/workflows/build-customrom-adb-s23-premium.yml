name: Build CUSTOMROM ADB S23 premium

on:
  push:
    branches:
      - refactor/customrom-adb-s23-premium
    paths:
      - 'apps/customrom-adb-native/**'
      - 'tools/validate_native_customrom.py'
      - '.github/workflows/build-customrom-adb-s23-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-customrom-adb-s23-premium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending contextual control v5
        shell: bash
        run: |
          ACTIVITY='apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsActivity.kt'
          if grep -q 'private fun openPackageContext' "$ACTIVITY"; then
            echo 'CONTROL_V5=ALREADY_APPLIED'
          else
            python3 tools/apply_control_round_v5.py
          fi

      - name: Validate CUSTOMROM native contract
        id: validate
        continue-on-error: true
        run: python3 tools/validate_native_customrom.py

      - name: Android SDK
        if: steps.validate.outcome == 'success'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 36
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        if: steps.validate.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build premium debug APK
        id: android_build
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Commit verified contextual control source
        if: steps.validate.outcome == 'success' && steps.android_build.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsActivity.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsModels.kt \
            apps/customrom-adb-native/app/src/main/assets/recipes.json \
            tools/validate_native_customrom.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add contextual package control and scrollable workflows'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'VERIFIED_SOURCE_ALREADY_COMMITTED=1'
          fi

      - name: Collect artifact and integrity proof
        id: collect
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p out/s23-premium
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk out/s23-premium/CUSTOMROM-ADB-S23-PREMIUM-debug.apk
          APK_SHA=$(sha256sum out/s23-premium/CUSTOMROM-ADB-S23-PREMIUM-debug.apk | awk '{print $1}')
          echo "$APK_SHA  CUSTOMROM-ADB-S23-PREMIUM-debug.apk" | tee out/s23-premium/sha256.txt
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          cat > out/s23-premium/build-info.txt <<EOF
          product=CUSTOMROM ADB S23 Premium
          source_branch=${GITHUB_REF_NAME}
          source_commit=$(git rev-parse HEAD)
          run_id=${GITHUB_RUN_ID}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          backend=com.flyfishxu:kadb:2.1.1
          compileSdk=36
          targetSdk=35
          EOF

      - name: Upload S23 premium APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-S23-PREMIUM
          path: out/s23-premium/
          retention-days: 14
          if-no-files-found: error

      - name: Publish branch-local build proof
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          APK_SHA: ${{ steps.collect.outputs.apk_sha }}
        shell: bash
        run: |
          if [ "$VALIDATE_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; then STATUS=PASS; else STATUS=FAIL; fi
          mkdir -p ci
          cat > ci/s23-premium-build-proof.json <<EOF
          {
            "status": "${STATUS}",
            "validation": "${VALIDATE_OUTCOME}",
            "android_build": "${BUILD_OUTCOME}",
            "artifact": "CUSTOMROM-ADB-S23-PREMIUM",
            "apk": "CUSTOMROM-ADB-S23-PREMIUM-debug.apk",
            "apk_sha256": "${APK_SHA}",
            "source_branch": "${GITHUB_REF_NAME}",
            "source_commit": "$(git rev-parse HEAD)",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/s23-premium-build-proof.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record S23 premium build ${STATUS}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce build result
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
        shell: bash
        run: |
          test "$VALIDATE_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
