name: Build CUSTOMROM ADB S23 practical V6.1

on:
  push:
    branches:
      - refactor/customrom-adb-s23-premium
    paths:
      - 'apps/customrom-adb-native/**'
      - 'tools/validate_native_customrom.py'
      - 'tools/apply_control_round_v5.py'
      - 'tools/apply_spotify_diagnostic.py'
      - 'tools/apply_practical_ops_v6.py'
      - 'tools/apply_agent_installer_v61.py'
      - '.github/workflows/build-customrom-adb-s23-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-customrom-adb-s23-practical-v61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark V6.1 run started
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p ci
          cat > ci/practical-ops-v61-live.json <<EOF
          {
            "status": "RUNNING",
            "source_branch": "${GITHUB_REF_NAME}",
            "input_commit": "$(git rev-parse HEAD)",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "started_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git add ci/practical-ops-v61-live.json
          git commit -m 'ci: mark practical V6.1 run started [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending contextual control v5
        shell: bash
        run: |
          ACTIVITY='apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsActivity.kt'
          if grep -q 'private fun openPackageContext' "$ACTIVITY"; then
            echo 'CONTROL_V5=ALREADY_APPLIED'
          else
            python3 tools/apply_control_round_v5.py
          fi

      - name: Apply Spotify performance diagnostic
        shell: bash
        run: python3 tools/apply_spotify_diagnostic.py

      - name: Apply practical operations v6
        shell: bash
        run: python3 tools/apply_practical_ops_v6.py

      - name: Apply one-tap Agent installer v6.1
        id: apply_v61
        continue-on-error: true
        shell: bash
        run: python3 tools/apply_agent_installer_v61.py

      - name: Validate CUSTOMROM native contract
        id: validate
        if: steps.apply_v61.outcome == 'success'
        continue-on-error: true
        run: python3 tools/validate_native_customrom.py

      - name: Android SDK
        if: steps.validate.outcome == 'success'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 36
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        if: steps.validate.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build S23 app with embedded TayTech Agent
        id: android_build
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Commit verified practical V6.1 source
        id: source_commit
        if: steps.validate.outcome == 'success' && steps.android_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '/build/\n' > apps/customrom-adb-native/agent/.gitignore
          git rm -r --cached --ignore-unmatch apps/customrom-adb-native/agent/build
          git add \
            apps/customrom-adb-native/settings.gradle.kts \
            apps/customrom-adb-native/agent/.gitignore \
            apps/customrom-adb-native/agent/build.gradle.kts \
            apps/customrom-adb-native/agent/src \
            apps/customrom-adb-native/app/build.gradle.kts \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/AdbRemoteController.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsActivity.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/PremiumOpsModels.kt \
            apps/customrom-adb-native/app/src/main/java/com/customrom/adb/FunctionalActionEngine.kt \
            apps/customrom-adb-native/app/src/main/assets/recipes.json \
            tools/validate_native_customrom.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: finalize practical operations v6.1 source [skip ci]'
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            git pull --rebase origin ${GITHUB_REF_NAME}
            echo 'VERIFIED_SOURCE_ALREADY_COMMITTED=1'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts and integrity proof
        id: collect
        if: steps.android_build.outcome == 'success' && steps.source_commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out/practical-v61
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk out/practical-v61/CUSTOMROM-ADB-S23-PRACTICAL-V6.1-debug.apk
          cp apps/customrom-adb-native/agent/build/outputs/apk/debug/agent-debug.apk out/practical-v61/CUSTOMROM-Agent-TayTech-debug.apk
          APP_SHA=$(sha256sum out/practical-v61/CUSTOMROM-ADB-S23-PRACTICAL-V6.1-debug.apk | awk '{print $1}')
          AGENT_SHA=$(sha256sum out/practical-v61/CUSTOMROM-Agent-TayTech-debug.apk | awk '{print $1}')
          printf '%s  %s\n%s  %s\n' "$APP_SHA" 'CUSTOMROM-ADB-S23-PRACTICAL-V6.1-debug.apk' "$AGENT_SHA" 'CUSTOMROM-Agent-TayTech-debug.apk' | tee out/practical-v61/sha256.txt
          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "agent_sha=$AGENT_SHA" >> "$GITHUB_OUTPUT"
          cat > out/practical-v61/build-info.txt <<EOF
          product=CUSTOMROM ADB S23 Practical Operations V6.1
          source_branch=${GITHUB_REF_NAME}
          source_commit=$(git rev-parse HEAD)
          run_id=${GITHUB_RUN_ID}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          recipes=$(python3 -c 'import json; print(len(json.load(open("apps/customrom-adb-native/app/src/main/assets/recipes.json"))))')
          backend=com.flyfishxu:kadb:2.1.1
          companion=com.customrom.agent
          companion_embedded=true
          compileSdk=36
          targetSdk=35
          EOF

      - name: Upload practical V6.1 artifacts
        id: upload
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-S23-PRACTICAL-V6.1
          path: out/practical-v61/
          retention-days: 14
          if-no-files-found: error

      - name: Publish isolated V6.1 proof
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply_v61.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          SOURCE_OUTCOME: ${{ steps.source_commit.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          APP_SHA: ${{ steps.collect.outputs.app_sha }}
          AGENT_SHA: ${{ steps.collect.outputs.agent_sha }}
        shell: bash
        run: |
          if [ "$APPLY_OUTCOME" = "success" ] && [ "$VALIDATE_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ] && [ "$SOURCE_OUTCOME" = "success" ] && [ "$COLLECT_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then STATUS=PASS; else STATUS=FAIL; fi
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin ${GITHUB_REF_NAME}
          mkdir -p ci
          rm -f ci/practical-ops-v61-live.json
          cat > ci/practical-ops-v61-proof.json <<EOF
          {
            "status": "${STATUS}",
            "apply_v61": "${APPLY_OUTCOME}",
            "validation": "${VALIDATE_OUTCOME}",
            "android_build": "${BUILD_OUTCOME}",
            "source_commit_step": "${SOURCE_OUTCOME}",
            "collect": "${COLLECT_OUTCOME}",
            "upload": "${UPLOAD_OUTCOME}",
            "artifact": "CUSTOMROM-ADB-S23-PRACTICAL-V6.1",
            "app_apk": "CUSTOMROM-ADB-S23-PRACTICAL-V6.1-debug.apk",
            "app_sha256": "${APP_SHA}",
            "agent_apk": "CUSTOMROM-Agent-TayTech-debug.apk",
            "agent_sha256": "${AGENT_SHA}",
            "agent_embedded": true,
            "source_branch": "${GITHUB_REF_NAME}",
            "source_commit": "$(git rev-parse HEAD)",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "finished_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/practical-ops-v61-live.json ci/practical-ops-v61-proof.json
          git commit -m "ci: record practical operations v6.1 ${STATUS} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Enforce build result
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply_v61.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          SOURCE_OUTCOME: ${{ steps.source_commit.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          test "$APPLY_OUTCOME" = "success"
          test "$VALIDATE_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$SOURCE_OUTCOME" = "success"
          test "$COLLECT_OUTCOME" = "success"
          test "$UPLOAD_OUTCOME" = "success"
