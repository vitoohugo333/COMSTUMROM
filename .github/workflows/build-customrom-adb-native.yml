name: Build CUSTOMROM ADB native

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/customrom-adb-s23-premium
    paths:
      - 'apps/customrom-adb-native/**'
      - 'tools/validate_native_customrom.py'
      - '.github/workflows/build-customrom-adb-native.yml'

permissions:
  contents: write

concurrency:
  group: build-customrom-adb-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate native CUSTOMROM contract
        id: validate
        continue-on-error: true
        run: python3 tools/validate_native_customrom.py

      - name: Android SDK
        if: steps.validate.outcome == 'success'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install stable Android API 36
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        if: steps.validate.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        id: android_build
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Collect APK and metadata
        id: collect
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p out/native
          if [ "$GITHUB_REF_NAME" = "refactor/customrom-adb-s23-premium" ]; then
            APK_NAME=CUSTOMROM-ADB-S23-PREMIUM-debug.apk
            ARTIFACT_NAME=CUSTOMROM-ADB-S23-PREMIUM
          else
            APK_NAME=CUSTOMROM-ADB-native-debug.apk
            ARTIFACT_NAME=CUSTOMROM-ADB-native
          fi
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk "out/native/$APK_NAME"
          APK_SHA=$(sha256sum "out/native/$APK_NAME" | awk '{print $1}')
          echo "$APK_SHA  $APK_NAME" | tee out/native/sha256.txt
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          cat > out/native/build-info.txt <<EOF
          build=CUSTOMROM ADB
          branch=${GITHUB_REF_NAME}
          backend=com.flyfishxu:kadb:2.1.1
          coroutines=1.10.2
          compileSdk=36
          minSdk=29
          targetSdk=35
          agp=9.3.1
          gradle=9.5.0
          source_commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: out/native/
          retention-days: 14
          if-no-files-found: error

      - name: Publish branch-local build proof
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          APK_SHA: ${{ steps.collect.outputs.apk_sha }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          ARTIFACT_NAME: ${{ steps.collect.outputs.artifact_name }}
        shell: bash
        run: |
          if [ "$VALIDATE_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; then STATUS=PASS; else STATUS=FAIL; fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            PROOF_PATH=ci/native-build-proof.json
          else
            PROOF_PATH=ci/s23-premium-build-proof.json
          fi
          mkdir -p ci
          cat > "$PROOF_PATH" <<EOF
          {
            "status": "${STATUS}",
            "validation": "${VALIDATE_OUTCOME}",
            "android_build": "${BUILD_OUTCOME}",
            "artifact": "${ARTIFACT_NAME}",
            "apk": "${APK_NAME}",
            "apk_sha256": "${APK_SHA}",
            "source_branch": "${GITHUB_REF_NAME}",
            "source_commit": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROOF_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "ci: record ${GITHUB_REF_NAME} native build ${STATUS}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce build result
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
        shell: bash
        run: |
          test "$VALIDATE_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
