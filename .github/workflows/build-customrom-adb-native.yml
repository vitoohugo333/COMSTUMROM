name: Build CUSTOMROM ADB native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customrom-adb-native/**'
      - '.github/workflows/build-customrom-adb-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Collect APK and metadata
        shell: bash
        run: |
          mkdir -p out/native
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk out/native/CUSTOMROM-ADB-native-debug.apk
          sha256sum out/native/CUSTOMROM-ADB-native-debug.apk | tee out/native/sha256.txt
          cat > out/native/build-info.txt <<EOF
          build=CUSTOMROM ADB native
          backend=com.flyfishxu:kadb:2.1.3
          minSdk=26
          targetSdk=35
          commit=${GITHUB_SHA}
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-native
          path: out/native/
          retention-days: 14
          if-no-files-found: error
