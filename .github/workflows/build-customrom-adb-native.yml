name: Build CUSTOMROM ADB native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customrom-adb-native/**'
      - 'tools/validate_native_customrom.py'
      - '.github/workflows/build-customrom-adb-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate native CUSTOMROM contract
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/validate_native_customrom.py

      - name: Android SDK
        if: steps.validate.outcome == 'success'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API 37
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37' 'build-tools;36.0.0'

      - name: Setup Gradle
        if: steps.validate.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        id: android_build
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Collect APK and metadata
        id: collect
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p out/native
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk out/native/CUSTOMROM-ADB-native-debug.apk
          APK_SHA=$(sha256sum out/native/CUSTOMROM-ADB-native-debug.apk | awk '{print $1}')
          echo "$APK_SHA  CUSTOMROM-ADB-native-debug.apk" | tee out/native/sha256.txt
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          cat > out/native/build-info.txt <<EOF
          build=CUSTOMROM ADB native
          backend=com.flyfishxu:kadb:2.1.3
          compileSdk=37
          minSdk=29
          targetSdk=35
          agp=9.3.1
          gradle=9.5.0
          source_commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-native
          path: out/native/
          retention-days: 14
          if-no-files-found: error

      - name: Publish machine-readable build proof
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          APK_SHA: ${{ steps.collect.outputs.apk_sha }}
        run: |
          if [ "$VALIDATE_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; then
            STATUS=PASS
          else
            STATUS=FAIL
          fi
          mkdir -p ci
          cat > ci/native-build-proof.json <<EOF
          {
            "status": "${STATUS}",
            "validation": "${VALIDATE_OUTCOME}",
            "android_build": "${BUILD_OUTCOME}",
            "artifact": "CUSTOMROM-ADB-native",
            "apk": "CUSTOMROM-ADB-native-debug.apk",
            "apk_sha256": "${APK_SHA}",
            "source_commit": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/native-build-proof.json
          git commit -m "ci: record native CUSTOMROM ADB build ${STATUS}" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce build result
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
        run: |
          test "$VALIDATE_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
