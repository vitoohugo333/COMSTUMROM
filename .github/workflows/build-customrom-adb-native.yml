name: Build CUSTOMROM ADB native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customrom-adb-native/**'
      - 'tools/validate_native_customrom.py'
      - '.github/workflows/build-customrom-adb-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate native CUSTOMROM contract
        shell: bash
        run: |
          python3 tools/validate_native_customrom.py

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p apps/customrom-adb-native :app:assembleDebug --stacktrace

      - name: Collect APK and metadata
        id: collect
        shell: bash
        run: |
          mkdir -p out/native
          cp apps/customrom-adb-native/app/build/outputs/apk/debug/app-debug.apk out/native/CUSTOMROM-ADB-native-debug.apk
          APK_SHA=$(sha256sum out/native/CUSTOMROM-ADB-native-debug.apk | awk '{print $1}')
          echo "$APK_SHA  CUSTOMROM-ADB-native-debug.apk" | tee out/native/sha256.txt
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          cat > out/native/build-info.txt <<EOF
          build=CUSTOMROM ADB native
          backend=com.flyfishxu:kadb:2.1.3
          minSdk=29
          targetSdk=35
          source_commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMROM-ADB-native
          path: out/native/
          retention-days: 14
          if-no-files-found: error

      - name: Publish machine-readable build proof
        shell: bash
        env:
          APK_SHA: ${{ steps.collect.outputs.apk_sha }}
        run: |
          mkdir -p ci
          cat > ci/native-build-proof.json <<EOF
          {
            "status": "PASS",
            "artifact": "CUSTOMROM-ADB-native",
            "apk": "CUSTOMROM-ADB-native-debug.apk",
            "apk_sha256": "${APK_SHA}",
            "source_commit": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/native-build-proof.json
          if git diff --cached --quiet; then
            echo 'Build proof unchanged.'
          else
            git commit -m 'ci: record successful native CUSTOMROM ADB build'
            git push origin HEAD:main
          fi
